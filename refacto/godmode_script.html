<!-- Ajouter dans index.html juste avant </body> -->
<!-- God Mode — easter egg console SmartPointage -->
<script>
(function() {
  window.godmode = async function() {
    const pwd = prompt('SmartPointage — Acces restreint\nMot de passe :');
    if (!pwd) return;

    try {
      const res = await fetch('/api/auth/godmode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });

      if (!res.ok) {
        console.error('%c Acces refuse.', 'color:#c62828;font-weight:bold;font-size:14px;');
        return;
      }

      const data = await res.json();
      localStorage.setItem('pamecas_token', data.token);
      localStorage.setItem('pamecas_user', JSON.stringify(data.user));

      console.clear();
      console.log(
        '%c ⚡ SmartPointage God Mode actif ',
        'background:#1b5e20;color:gold;font-size:14px;font-weight:bold;padding:6px 12px;border-radius:4px;'
      );

      window.location.hash = '#/dashboard';
      window.location.reload();

    } catch (err) {
      console.error('Erreur connexion God Mode:', err.message);
    }
  };

  // Message discret au chargement (visible seulement si devtools ouvert)
  console.log(
    '%c SmartPointage v2.0 ',
    'background:#2e7d32;color:white;font-size:11px;padding:2px 8px;border-radius:3px;'
  );
})();
</script>
